<style>
:root{--ac:#ffc83d}
html,body{height:100%;overflow:hidden;touch-action:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;background:#0a0d18}
#cv.drag{cursor:grabbing}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:20px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#ui{position:fixed;left:14px;top:70px;bottom:14px;width:290px;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:14px;z-index:5;transition:transform .4s,opacity .4s}
body.photo #ui,body.photo .top,body.photo #hud,body.photo #mini,body.photo #card,body.photo #hint{opacity:0;pointer-events:none}
#ui h3{font-family:var(--disp);font-weight:600;font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--dim);margin-bottom:8px}

.dice:hover{transform:rotate(25deg) scale(1.08)}
.row{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.row:last-child{margin-bottom:0}
.row label{display:flex;justify-content:space-between;font-size:12px;color:#c3cdee}
.row label b{color:var(--ac);font-variant-numeric:tabular-nums}
select{font:inherit;font-size:13px;color:var(--ink);background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:10px;padding:9px 10px;outline:none;width:100%}
select option{background:#0b0e1e}
input[type=range]{-webkit-appearance:none;appearance:none;height:4px;border-radius:4px;background:rgba(255,255,255,.14);outline:none;width:100%}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--ac);box-shadow:0 0 12px var(--ac);cursor:pointer;border:0}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--ac);border:0;cursor:pointer}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg.two{grid-template-columns:repeat(2,1fr)}
.seg button{padding:9px 4px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-size:11.5px;transition:.2s}
.seg button.on{background:color-mix(in srgb,var(--ac) 26%,transparent);border-color:var(--ac)}
.tg{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-size:12px;margin-bottom:6px;transition:.2s;width:100%}
.tg i{width:30px;height:16px;border-radius:99px;background:rgba(255,255,255,.18);position:relative;transition:.2s}
.tg i::after{content:'';position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;background:#fff;transition:.2s}
.tg.on i{background:var(--ac)}.tg.on i::after{left:16px;background:#05060d}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn.sm{padding:10px 14px;font-size:10.5px}
#hud{position:fixed;right:14px;top:70px;z-index:5;padding:14px 18px;text-align:right;min-width:190px;transition:opacity .4s}
#clock{font-family:var(--disp);font-weight:900;font-size:34px;letter-spacing:.02em;line-height:1}
#cityname{font-family:var(--disp);font-weight:600;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--ac);margin-bottom:6px}
#stats{margin-top:8px;font-size:11.5px;color:#c3cdee;line-height:1.6;letter-spacing:.03em}
#mini{position:fixed;right:14px;bottom:14px;width:190px;height:190px;border-radius:16px;overflow:hidden;z-index:5;cursor:pointer;transition:opacity .4s;border:1px solid var(--line)}
#mini canvas{position:absolute;inset:0;width:100%;height:100%}
#card{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:6;padding:12px 16px;min-width:260px;text-align:center;display:none;transition:opacity .4s}
#card b{font-family:var(--disp);font-size:13px;letter-spacing:.06em}
#card small{display:block;color:#c3cdee;margin-top:4px;font-size:12px}
#card .x{position:absolute;right:8px;top:6px;color:var(--dim);font-size:14px}
#hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);z-index:4;white-space:nowrap;transition:opacity .4s;pointer-events:none}
#load{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#05060d;color:var(--dim);font-family:var(--disp);letter-spacing:.3em;font-size:12px;transition:opacity .6s}
#load.gone{opacity:0;pointer-events:none}

@media (max-width:900px){

  #hud{top:108px;padding:10px 12px;min-width:140px}#clock{font-size:24px}#stats{display:none}

<script>
(()=>{
'use strict';
/* ================================================================ utils */
const $=s=>document.querySelector(s);
const TAU=Math.PI*2;
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function mulberry32(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rngFor=(s,t)=>mulberry32(hashStr(s+'|'+t));
const ri=(r,a,b)=>a+Math.floor(r()*(b-a+1));
const pick=(r,a)=>a[Math.floor(r()*a.length)];
const rr=(r,a,b)=>a+r()*(b-a);
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const newSeed=()=>{let s='';const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';for(let i=0;i<6;i++)s+=a[Math.floor(Math.random()*a.length)];return s;};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2300);}
function hsl(h,s,l,a){return a===undefined?`hsl(${h|0} ${Math.round(s*100)}% ${Math.round(l*100)}%)`:`hsla(${h|0},${Math.round(s*100)}%,${Math.round(l*100)}%,${a})`;}
function valueNoise(seed){
  const h=(x,y)=>mulberry32(hashStr(seed+'|'+x+','+y))();
  const cache=new Map();
  const g=(x,y)=>{const k=x*73856093^y*19349663;let v=cache.get(k);if(v===undefined){v=h(x,y);cache.set(k,v);}return v;};
  return (x,y)=>{const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
    return lerp(lerp(g(xi,yi),g(xi+1,yi),u),lerp(g(xi,yi+1),g(xi+1,yi+1),u),v);};
}
/* geometria */
function ptInPoly(x,y,p){let ins=false;for(let i=0,j=p.length-1;i<p.length;j=i++){const a=p[i],b=p[j];if(((a[1]>y)!==(b[1]>y))&&(x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0]))ins=!ins;}return ins;}
function segInt(ax,ay,bx,by,cx,cy,dx,dy){
  const d=(bx-ax)*(dy-cy)-(by-ay)*(dx-cx);if(Math.abs(d)<1e-9)return false;
  const t=((cx-ax)*(dy-cy)-(cy-ay)*(dx-cx))/d,u=((cx-ax)*(by-ay)-(cy-ay)*(bx-ax))/d;
  return t>=0&&t<=1&&u>=0&&u<=1;
}
function segHitsPoly(ax,ay,bx,by,p){
  if(ptInPoly(ax,ay,p)||ptInPoly(bx,by,p))return true;
  for(let i=0,j=p.length-1;i<p.length;j=i++)if(segInt(ax,ay,bx,by,p[j][0],p[j][1],p[i][0],p[i][1]))return true;
  return false;
}
function polyArea(p){let a=0;for(let i=0,j=p.length-1;i<p.length;j=i++)a+=(p[j][0]+p[i][0])*(p[j][1]-p[i][1]);return a/2;}
function centroid(p){let x=0,y=0;for(const q of p){x+=q[0];y+=q[1];}return[x/p.length,y/p.length];}
function bboxOf(p){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const q of p){if(q[0]<x0)x0=q[0];if(q[0]>x1)x1=q[0];if(q[1]<y0)y0=q[1];if(q[1]>y1)y1=q[1];}return[x0,y0,x1,y1];}
function hull(pts){
  const p=pts.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);
  const lo=[];for(const q of p){while(lo.length>=2&&cr(lo[lo.length-2],lo[lo.length-1],q)<=0)lo.pop();lo.push(q);}
  const up=[];for(let i=p.length-1;i>=0;i--){const q=p[i];while(up.length>=2&&cr(up[up.length-2],up[up.length-1],q)<=0)up.pop();up.push(q);}
  lo.pop();up.pop();return lo.concat(up);
}
function lineInt(p1,d1,p2,d2){const c=d1[0]*d2[1]-d1[1]*d2[0];if(Math.abs(c)<1e-6)return null;const t=((p2[0]-p1[0])*d2[1]-(p2[1]-p1[1])*d2[0])/c;return[p1[0]+d1[0]*t,p1[1]+d1[1]*t];}
/* arretramento a distanze diverse per lato (poligono orario/antiorario qualsiasi) */
function insetPoly(pts,dists){
  const n=pts.length,sgn=polyArea(pts)>0?1:-1,lines=[];
  for(let i=0;i<n;i++){
    const a=pts[i],b=pts[(i+1)%n];let dx=b[0]-a[0],dy=b[1]-a[1];const l=Math.hypot(dx,dy)||1;dx/=l;dy/=l;
    const nx=-dy*sgn*-1,ny=dx*sgn*-1;
    lines.push({p:[a[0]+nx*dists[i],a[1]+ny*dists[i]],d:[dx,dy]});
  }
  const out=[];
  for(let i=0;i<n;i++){
    const L0=lines[(i+n-1)%n],L1=lines[i];
    let q=lineInt(L0.p,L0.d,L1.p,L1.d);
    if(!q)q=L1.p;
    const dmax=Math.max(dists[(i+n-1)%n],dists[i])*3.2+4;
    if(Math.hypot(q[0]-pts[i][0],q[1]-pts[i][1])>dmax){const m=[(L0.p[0]+L1.p[0])/2,(L0.p[1]+L1.p[1])/2];q=m;}
    out.push(q);
  }
  return out;
}
/* ================================================================ stili e nomi */
const STYLES={
  metro:{n:'Metropoli',sp:170,jit:.05,warp:0,ground:'#86947f',road:'#3a3e47',walk:'#a7acb3',lane:'#e8e8ee',
    court:{down:'#8d9198',com:'#8f9c86',res:'#80a56e',ind:'#807d76'},
    walls:[[212,.1,.72],[205,.2,.62],[198,.3,.52],[28,.1,.74],[0,0,.82]],roofs:[[210,.06,.46],[0,0,.58],[25,.1,.5]],
    tree:'#41803f',treeL:'#68ab5c',water:['#2f6f9e','#4b94c4']},
  euro:{n:'Città europea',sp:140,jit:.30,warp:46,ground:'#9eaa86',road:'#5a5e64',walk:'#cbc3b2',lane:'#ebe6d8',
    court:{down:'#b6ab9c',com:'#9dab85',res:'#8aa872',ind:'#8d887c'},
    walls:[[34,.42,.82],[28,.38,.74],[40,.3,.7],[12,.42,.72],[48,.38,.8]],roofs:[[12,.62,.46],[18,.56,.5],[8,.5,.4],[24,.52,.56]],
    tree:'#4a8138',treeL:'#7fb35a',water:['#3a7ca8','#5ea0cc']},
  neon:{n:'Neon',sp:180,jit:.03,warp:0,ground:'#242c3f',road:'#161a26',walk:'#2f3855',lane:'#7be8ff',
    court:{down:'#202639',com:'#222b3f',res:'#202c38',ind:'#232634'},
    walls:[[230,.28,.3],[255,.32,.32],[210,.3,.27],[280,.28,.3]],roofs:[[220,.2,.2],[250,.25,.22]],
    tree:'#2b6c68',treeL:'#44e6c4',water:['#1a3a6c','#2e62b0'],neon:true}
};
const SYL=['ba','be','bi','bo','ca','ce','co','da','de','di','do','fa','fe','fi','la','le','li','lo','ma','me','mi','mo','na','ne','ni','no','pa','pe','pi','po','ra','re','ri','ro','sa','se','si','so','ta','te','ti','to','va','ve','vi','vo','za','zo'];
const END=['polis','burgo','mar','gate','ville','ora','ia','ento','ara'];
const DNAMES=['Aurora','Zefiro','Vesta','Lumina','Cenere','Marea','Orione','Tramonto','Alba','Brezza','Ginestra','Quarzo','Argento','Corallo','Ametista','Lunaria','Solaris','Nebula','Tempesta','Faro','Ambra','Giada','Cobalto','Rubino','Smeraldo','Zaffiro'];
const DKIND=['Centro','Porto','Colli','Giardini','Distretto','Rione','Borgo','Quartiere','Parco','Mercato'];
const BNAME=['Aurora','Zefiro','Vesta','Atlante','Meridiana','Polaris','Orione','Cometa','Eclissi','Zenit','Cardine','Orizzonte','Levante','Ponente','Tramontana','Alisei'];
function cityName(r){return cap(pick(r,SYL)+pick(r,SYL)+pick(r,END));}

/* ================================================================ generazione */
const ZONES={
  down:{tw:[34,54],td:[34,52],h:[80,280]},
  com:{tw:[30,48],td:[30,46],h:[26,100]},
  res:{tw:[20,30],td:[24,36],h:[8,30]},
  ind:{tw:[62,110],td:[52,90],h:[6,16]}
};
function genCity(seed,opt){
  const r=rngFor(seed,'city'),st=STYLES[opt.style];
  const S={S:2200,M:3000,L:4000}[opt.size],C=S/2;
  const nz=valueNoise(seed+'|z'),nw=valueNoise(seed+'|w');
  const city={seed,opt,S,st,name:cityName(rngFor(seed,'name')),waters:[],nodes:[],edges:[],blocks:[],buildings:[],parks:[],trees:[],lamps:[],districts:[],boats:[],landmarks:[]};
  /* ---- acqua ---- */
  let wt=opt.water;
  if(wt==='auto')wt=pick(r,['river','river','sea','lake','both','none']);
  if(wt==='river'||wt==='both'){
    const th=r()*Math.PI,u=[Math.cos(th),Math.sin(th)],nrm=[-u[1],u[0]];
    const off=rr(r,-.18,.18)*S,amp=rr(r,.05,.1)*S,fr=TAU/(S*rr(r,.55,.9)),ph=r()*TAU;
    const cen=[];
    for(let t=-S*.8;t<=S*.8;t+=45){const k=amp*Math.sin(t*fr+ph)+off+(nw(t*.004,3)-.5)*60;cen.push([C+u[0]*t+nrm[0]*k,C+u[1]*t+nrm[1]*k,52+nw(t*.01,9)*30]);}
    const L=[],R=[];
    for(let i=0;i<cen.length;i++){
      const a=cen[Math.max(0,i-1)],b=cen[Math.min(cen.length-1,i+1)];
      let dx=b[0]-a[0],dy=b[1]-a[1];const l=Math.hypot(dx,dy)||1;dx/=l;dy/=l;
      L.push([cen[i][0]-dy*cen[i][2]/2,cen[i][1]+dx*cen[i][2]/2]);R.push([cen[i][0]+dy*cen[i][2]/2,cen[i][1]-dx*cen[i][2]/2]);
    }
    city.waters.push({kind:'river',bridge:true,poly:L.concat(R.reverse()),center:cen});
  }
  if(wt==='sea'||wt==='both'){
    const side=ri(r,0,3),base=rr(r,.14,.24)*S,pol=[];
    for(let x=-60;x<=S+60;x+=40){
      const d=base+(nw(x*.003,20)-.5)*S*.12+Math.sin(x*.0032+r()*0)*S*.025;
      pol.push(side===0?[x,S-d]:side===1?[x,d]:side===2?[d,x]:[S-d,x]);
    }
    const far=side===0?[[S+60,S+400],[-60,S+400]]:side===1?[[S+60,-400],[-60,-400]]:side===2?[[-400,S+60],[-400,-60]]:[[S+400,S+60],[S+400,-60]];
    city.waters.push({kind:'sea',bridge:false,poly:pol.concat(far),side});
  }
  if(wt==='lake'){
    const ang=r()*TAU,dist=rr(r,.2,.32)*S,cx=C+Math.cos(ang)*dist,cy=C+Math.sin(ang)*dist,rad=rr(r,.09,.15)*S,pol=[];
    for(let a=0;a<TAU;a+=.2)pol.push([cx+Math.cos(a)*rad*(1+(nw(Math.cos(a)*2+5,Math.sin(a)*2+5)-.5)*.5),cy+Math.sin(a)*rad*(1+(nw(Math.cos(a)*2+9,Math.sin(a)*2+1)-.5)*.5)]);
    city.waters.push({kind:'lake',bridge:false,poly:pol});
  }
  city.waterType=wt;

/* ---- Livello S: ombre ---- */
function drawS(c,x0,y0,x1,y1,sb){

    if(b.h<7)continue;

    const bx=[b.box[0]+Math.min(0,dx*L),b.box[1]+Math.min(0,dy*L),b.box[2]+Math.max(0,dx*L),b.box[3]+Math.max(0,dy*L)];

  }

    if(!inRect(p.box,x0,y0,x1,y1))continue;

    for(const t of p.trees){c.beginPath();c.ellipse(t[0]+dx*t[2]*1.4,t[1]+dy*t[2]*1.4,t[2]*1.1,t[2]*.9,0,0,TAU);c.fill();}

/* ---- Livello B: edifici ---- */
function wallColor(b,n){

function boxesOf(b){

function eachWall(fp,h0,h1,cb){

      const m2=long01?[(a1[0]+a2[0])/2,(a1[1]+a2[1])/2]:[(a2[0]+a3[0])/2,(a2[1]+a3[1])/2];

/* ---- cache chunk ---- */
const BUCKETS=[.35,.7,1.4,2.8];
function bucketFor(z){for(const b of BUCKETS)if(z<=b*1.4)return b;return BUCKETS[BUCKETS.length-1];}
function chunkKey(layer,cx,cy,b,extra){return `${cityId}|${layer}|${cx}|${cy}|${b}|${extra||''}`;}
function renderChunk(layer,cx,cy,b,extra){
  const key=chunkKey(layer,cx,cy,b,extra);
  let ch=chunkCache.get(key);
  if(ch){chunkCache.delete(key);chunkCache.set(key,ch);return ch;}
  const M=60,x0=cx*CH-M,y0=cy*CH-M,x1=(cx+1)*CH+M,y1=(cy+1)*CH+M;
  const px=Math.ceil(CH*b);
  const cv=layerCtx(px,px),c=cv.getContext('2d');
  c.scale(b,b);c.translate(-cx*CH,-cy*CH);
  // clip al chunk (con margine per i bordi)
  c.beginPath();c.rect(cx*CH-1,cy*CH-1,CH+2,CH+2);c.clip();
  const det=b>=.7;
  if(layer==='A')drawA(c,x0,y0,x1,y1,det);
  else if(layer==='S')drawS(c,x0-40,y0-40,x1+40,y1+40,+extra);
  else if(layer==='B')drawB(c,x0,y0,x1,y1,det);
  else drawL(c,x0,y0,x1,y1,det);
  chunkCache.set(key,cv);
  if(chunkCache.size>520){const k=chunkCache.keys().next().value;chunkCache.delete(k);}
  return cv;
}
function peekChunk(layer,cx,cy,b,extra){return chunkCache.get(chunkKey(layer,cx,cy,b,extra));}

/* ================================================================ traffico */
const VT={
  car:{len:12,wid:6,w:6},suv:{len:13,wid:6.6,w:3},taxi:{len:12,wid:6,w:1.2},truck:{len:21,wid:7.4,w:.8},bus:{len:26,wid:7.8,w:.9},police:{len:12,wid:6,w:.35},ambulance:{len:15,wid:7,w:.3}
};
const CARCOL=['#d84a4a','#3a6fd0','#e8e8ee','#222730','#8d949e','#e0a030','#3aa66a','#7a56c8','#c0c6cf','#1a1f2a','#cc6b2b'];
let cars=[],simT=0;
function signalState(n,grp,t){
  const s=n.sig;if(!s)return 'g';
  const T=s.gA+s.y+s.ar+s.gB+s.y+s.ar,x=(t+s.off)%T;
  let g0,g1;
  if(x<s.gA){g0='g';g1='r';}else if(x<s.gA+s.y){g0='y';g1='r';}else if(x<s.gA+s.y+s.ar){g0='r';g1='r';}
  else if(x<s.gA+s.y+s.ar+s.gB){g0='r';g1='g';}else if(x<s.gA+s.y+s.ar+s.gB+s.y){g0='r';g1='y';}else{g0='r';g1='r';}
  return grp===0?g0:g1;
}
function connFor(din,dout){
  const key=din.id+'>'+dout.id;
  if(connFor.cache.has(key))return connFor.cache.get(key);
  const p0=[din.ex,din.ey],p2=[dout.sx,dout.sy];
  let p1=lineInt(p0,[din.ux,din.uy],p2,[dout.ux,dout.uy]);
  const mx=(p0[0]+p2[0])/2,my=(p0[1]+p2[1])/2;
  if(!p1||Math.hypot(p1[0]-mx,p1[1]-my)>60)p1=[mx,my];
  let len=0,prev=p0;for(let i=1;i<=8;i++){const t=i/8,x=(1-t)**2*p0[0]+2*(1-t)*t*p1[0]+t*t*p2[0],y=(1-t)**2*p0[1]+2*(1-t)*t*p1[1]+t*t*p2[1];len+=Math.hypot(x-prev[0],y-prev[1]);prev=[x,y];}
  const cr=din.ux*dout.uy-din.uy*dout.ux,dt=din.ux*dout.ux+din.uy*dout.uy;
  const co={key,p0,p1,p2,len:Math.max(len,1),cars:[],turn:dt>.9?'s':cr>0?'r':'l',node:din.to};
  connFor.cache.set(key,co);return co;
}
connFor.cache=new Map();
function connPos(co,s){const t=clamp(s/co.len,0,1),x=(1-t)**2*co.p0[0]+2*(1-t)*t*co.p1[0]+t*t*co.p2[0],y=(1-t)**2*co.p0[1]+2*(1-t)*t*co.p1[1]+t*t*co.p2[1];
  const tx=2*(1-t)*(co.p1[0]-co.p0[0])+2*t*(co.p2[0]-co.p1[0]),ty=2*(1-t)*(co.p1[1]-co.p0[1])+2*t*(co.p2[1]-co.p1[1]);return[x,y,Math.atan2(ty,tx)];}
function route(from,to){
  // Dijkstra sui nodi
  const N=city.nodes.length,dist=new Float64Array(N).fill(1e9),prev=new Int32Array(N).fill(-1),pe=new Int32Array(N).fill(-1);
  const heap=[[0,from]];dist[from]=0;
  const push=x=>{heap.push(x);let i=heap.length-1;while(i>0){const p=(i-1)>>1;if(heap[p][0]<=heap[i][0])break;[heap[p],heap[i]]=[heap[i],heap[p]];i=p;}};
  const pop=()=>{const t=heap[0],l=heap.pop();if(heap.length){heap[0]=l;let i=0;for(;;){let a=i*2+1,b=a+1,m=i;if(a<heap.length&&heap[a][0]<heap[m][0])m=a;if(b<heap.length&&heap[b][0]<heap[m][0])m=b;if(m===i)break;[heap[m],heap[i]]=[heap[i],heap[m]];i=m;}}return t;};
  while(heap.length){const [d,u]=pop();if(d>dist[u])continue;if(u===to)break;
    for(const did of city.nodes[u].out){const D=city.dedges[did];const nd=d+D.L/D.speed*(D.type==='loc'?1.15:1);if(nd<dist[D.to]){dist[D.to]=nd;prev[D.to]=u;pe[D.to]=did;push([nd,D.to]);}}}
  if(prev[to]<0&&from!==to)return null;
  const path=[];let x=to;while(x!==from){path.push(pe[x]);x=prev[x];}
  return path.reverse();
}
function newCar(id,pre){
  const r=Math.random;
  const type=wpickT();
  const vt=VT[type];
  const car={id,type,len:vt.len,wid:vt.wid,col:type==='taxi'?'#f0b520':type==='police'?'#e8ecf2':type==='ambulance'?'#f5f5f5':type==='bus'?pick(r,['#d84a2a','#2a8ad8','#3aa66a']):type==='truck'?pick(r,['#e8e8ee','#c9a23a','#3a6fd0']):pick(r,CARCOL),
    d:null,s:0,v:0,route:[],ri:0,conn:null,cs:0,sf:rr(r,.85,1.1),ph:r()*TAU,brake:false,blink:0};
  const ds=city.dedges;let tries=0;
  while(tries++<40){
    const d=pick(r,ds);
    if(type==='bus'&&d.type==='loc'&&r()<.6)continue;
    const s=rr(r,5,Math.max(6,d.L-5));
    if(d.cars.every(o=>Math.abs(o.s-s)>o.len+car.len+4)){car.d=d;car.s=s;break;}
  }
  if(!car.d)return null;
  car.v=car.d.speed*.5*car.sf;

}
function wpickT(){const keys=Object.keys(VT);let s=0;for(const k of keys)s+=VT[k].w;let v=Math.random()*s;for(const k of keys){v-=VT[k].w;if(v<=0)return k;}return 'car';}
function d_add(d,car){d.cars.push(car);}
function d_del(d,car){const i=d.cars.indexOf(car);if(i>=0)d.cars.splice(i,1);}
function planRoute(car){
  const from=car.d.to;
  for(let k=0;k<6;k++){
    const to=Math.floor(Math.random()*city.nodes.length);
    if(to===from)continue;
    const p=route(from,to);
    if(p&&p.length){
      // evita inversione a U immediata
      car.route=p;car.ri=0;car.dest=to;return;
    }
  }
  car.route=[];
}
function leadFor(car){
  // ritorna {gap,v} del veicolo davanti o dell'ostacolo
  let gap=1e9,vl=0;
  if(car.conn){
    for(const o of car.conn.cars){if(o===car)continue;if(o.cs>car.cs){const g=o.cs-car.cs-(o.len+car.len)/2;if(g<gap){gap=g;vl=o.v;}}}
    const ndin=city.dedges[car.route[car.ri]];
    if(ndin){const gl=car.conn.len-car.cs;for(const o of ndin.cars){const g=gl+o.s-(o.len+car.len)/2;if(g<gap){gap=g;vl=o.v;}}}
    // priorità nei nodi
    const node=city.nodes[car.conn.node];
    for(const o of node.cars){if(o===car||o.id>car.id||!o.conn||o.conn===car.conn)continue;
      const pa=connPos(car.conn,car.cs),pb=connPos(o.conn,o.cs);
      const dist=Math.hypot(pa[0]-pb[0],pa[1]-pb[1]);
      if(dist<(o.len+car.len)/2+3){const fwd=Math.cos(pa[2]-Math.atan2(pb[1]-pa[1],pb[0]-pa[0]));if(fwd>-.2){const g=Math.max(.1,dist-(o.len+car.len)/2);if(g<gap){gap=g;vl=0;}}}
    }
  }else{
    const d=car.d;
    for(const o of d.cars){if(o===car)continue;if(o.s>car.s){const g=o.s-car.s-(o.len+car.len)/2;if(g<gap){gap=g;vl=o.v;}}}
    const dist=d.L-car.s;
    if(dist<70){
      const nid=car.route[car.ri];
      const nd=nid!==undefined?city.dedges[nid]:null;
      // semaforo
      const node=city.nodes[d.to];
      if(node.sig){
        const st=signalState(node,d.grp,simT);
        const brk=car.v*car.v/(2*45);
        if(st==='r'||(st==='y'&&brk<dist-2)){const g=dist-car.len/2-3;if(g<gap){gap=Math.max(.2,g);vl=0;}}
      }
      if(nd){
        const co=connFor(d,nd);
        for(const o of co.cars){const g=dist+(co.len-(o.cs))*0+0-(o.len+car.len)/2+o.cs;if(g<gap){gap=g;vl=o.v;}}

          for(const o of node.cars){const pb=connPos(o.conn,o.cs);if(Math.hypot(pa[0]-pb[0],pa[1]-pb[1])<(o.len+car.len)/2+5&&(o.conn.key!==co.key)){const g=Math.max(.2,dist-car.len/2-2);if(g<gap){gap=g;vl=0;}}}
        }

        for(const o of nd.cars){const g=dist+o.s-(o.len+car.len)/2;if(g<gap){gap=g;vl=o.v;}}
      }
    }
  }
  return{gap,vl};
}
function stepCar(car,dt){
  const d=car.d;
  const v0=(car.conn?(car.conn.turn==='s'?car.conn.vmax||d.speed:Math.min(d.speed,28)):d.speed)*car.sf*(car.type==='bus'||car.type==='truck'?.85:1);

  const dv=car.v-vl;
  const sStar=s0+Math.max(0,car.v*T+car.v*dv/(2*Math.sqrt(a*b)));

  car.v=Math.max(0,car.v+acc*dt);
  if(car.v<.2&&gap>40&&acc>0)car.v=.2;
  const ds=car.v*dt;
  if(car.conn){
    car.cs+=ds;
    if(car.conn.cs_exit===undefined&&car.cs>=car.conn.len){
      // esce sulla nuova corsia
      const nd=city.dedges[car.route[car.ri]];
      const rem=car.cs-car.conn.len;
      const node=city.nodes[car.conn.node];
      const i=car.conn.cars.indexOf(car);if(i>=0)car.conn.cars.splice(i,1);
      const j=node.cars.indexOf(car);if(j>=0)node.cars.splice(j,1);

    }

    car.s+=ds;

function carPose(car){

function setCars(n){

const cv=$('#cv'),ctx=cv.getContext('2d');

addEventListener('resize',resize);
const toS=(x,y)=>[(x-cam.x)*cam.z+VW/2,(y-cam.y)*cam.z+VH/2];

  const sun=Math.sin((t-6)/12*Math.PI);

const rain=[];for(let i=0;i<500;i++)rain.push([Math.random(),Math.random(),Math.random()]);

function drawLayer(layer,extra,alpha,blend){

  const cx0=Math.floor((cam.x-half[0])/CH),cx1=Math.floor((cam.x+half[0])/CH),cy0=Math.floor((cam.y-half[1])/CH),cy1=Math.floor((cam.y+half[1])/CH);
  const maxX=Math.ceil(city.S/CH),maxY=maxX;

    let ch=peekChunk(layer,cx,cy,b,extra);

      if(budget>0){ch=renderChunk(layer,cx,cy,b,extra);budget--;}

      if(car.type==='bus'){for(let k=0;k<5;k++)ctx.fillRect(-l/2+3+k*4.6,-w/2+1,3.2,w-2);}else ctx.fillRect(l/2-6,-w/2+1,4.4,w-2);}

function drawWeather(L,dt){

function simulate(simDt){

let last=performance.now(),tAccum=0,frameN=0;
function frame(now){
  requestAnimationFrame(frame);
  const dtReal=Math.min((now-last)/1000,.1);last=now;
  if(!city)return;
  // tempo
  const spdTab=[0,1,2,4,8,15,30,60,120,240,480];
  if(P.spd>0){P.time=(P.time+dtReal*spdTab[P.spd]/60)%24;}
  // simulazione
  const simDt=dtReal*[0,1,2,3,5][P.sim];
  if(simDt>0)simulate(simDt);
  // camera
  if(cam.follow){const p=carPose(cam.follow);cam.x+=(p[0]-cam.x)*Math.min(1,dtReal*5);cam.y+=(p[1]-cam.y)*Math.min(1,dtReal*5);cam.tz=Math.max(cam.tz,1.6);}
  cam.z+=(cam.tz-cam.z)*Math.min(1,dtReal*9);
  if(!cam.follow){cam.x=clamp(cam.x,-200,city.S+200);cam.y=clamp(cam.y,-200,city.S+200);}
  const L=lighting(P.time);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle='#0a0d18';ctx.fillRect(0,0,VW,VH);
  drawLayer.budget=4;
  drawLayer('A','',1);
  if(P.shadows&&L.day>.12){const sb=clamp(Math.round((P.time-6)/12*12),0,12);drawLayer('S',String(sb),clamp(L.day*1.1,0,1)*(1-L.dusk*.35));}
  drawCars(L);
  drawLayer('B','',1);
  drawPlane(L);
  // illuminazione ambientale (moltiplicazione)
  {
    const nc=[.19,.25,.46],dc=[1,.8,.62],k=L.night,du=L.dusk;
    let r=lerp(1,nc[0],k),g=lerp(1,nc[1],k),b=lerp(1,nc[2],k);
    r=lerp(r,dc[0],du*.6*(1-k*.5));g=lerp(g,dc[1],du*.6*(1-k*.5));b=lerp(b,dc[2],du*.6*(1-k*.5));
    ctx.save();ctx.globalCompositeOperation='multiply';ctx.fillStyle=`rgb(${Math.round(r*255)},${Math.round(g*255)},${Math.round(b*255)})`;ctx.fillRect(0,0,VW,VH);ctx.restore();
  }
  if(L.night>.05){
    drawLayer('L','',clamp(L.night*1.25,0,1)*(P.wx==='clear'?1:1.18),'lighter');
    drawCarLights(L);
  }
  drawLabels(L);
  drawWeather(L,dtReal);
  // HUD
  if((frameN++&7)===0){
    const hh=Math.floor(P.time),mm=Math.floor((P.time-hh)*60);
    $('#clock').textContent=`${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;
    $('#vTime').textContent=$('#clock').textContent;
    if(P.spd>0)$('#time').value=P.time;
    drawMiniView();
    updateCard();
  }
}

  const px=2400,k=px/city.S,out=document.createElement('canvas');out.width=out.height=px;const c=out.getContext('2d');
  c.scale(k,k);
  c.fillStyle=city.st.ground;c.fillRect(0,0,city.S,city.S);
  drawA(c,-80,-80,city.S+80,city.S+80,true);
  const L=lighting(P.time);
  if(P.shadows&&L.day>.12)drawS(c,-80,-80,city.S+80,city.S+80,clamp(Math.round((P.time-6)/12*12),0,12));
  drawB(c,-80,-80,city.S+80,city.S+80,true);
  c.setTransform(1,0,0,1,0,0);
  out.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`citta-${P.seed}-poster.png`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);toast('Poster scaricato');});
};
$('#uiToggle').onclick=()=>document.body.classList.add('ui');
document.querySelector('.top').addEventListener('click',e=>{if(e.target.closest('.brand'))return;document.body.classList.remove('ui');});

/* ---- avvio ---- */
resize();
if(!readHash())P.seed=newSeed();
syncUi();
requestAnimationFrame(frame);
rebuild(false);
window.__city={P,get city(){return city;},get cars(){return cars;},cam,genCity,chunkCache,setCars,rebuild,lighting,stepCar,simulate,leadFor,signalState,carPose,get simT(){return simT;}};
})();
